---
layout: default
---
<div class="page-layout">
  <div class="container">
    <div class="page-header">
      <h1>{{ page.title }}</h1>
      {% if page.description %}
      <p class="page-description">{{ page.description }}</p>
      {% endif %}
    </div>
    <div class="page-content">
      {{ content }}
    </div>
  </div>
</div>
